# ForeSeeMe — acquisition pipeline configuration (Sprint 2, Prompt 2).
#
# The single knob-board for the config-driven acquisition framework
# (ml/pipelines/acquisition_base.py). Source-specific pipelines (Prompts 3-5)
# read this file and add no settings of their own. No secrets here.

# Project-wide modeling window. Mirrors `modeling_window` in sources.yaml, which
# was MEASURED empirically in Prompt 1 (see reports/data_availability.md). Keep
# the two in sync; sources.yaml is the source of the measurement, this is the
# value the acquisition pipelines actually fetch for.
window:
  start: "2022-08-05"          # scarcest feature: air_quality/us_aqi
  end: "2026-06-28"            # common latest non-null at last measurement

# Idempotent caching. If a raw file for a (city, source, window) already exists
# and its SHA-256 matches the manifest, the network call is skipped.
cache:
  reuse_on_hash_match: true    # skip download when cached file hash matches manifest
  verify_hash: true            # recompute the on-disk hash before trusting the cache

# Retry / backoff for transient failures. Exponential backoff:
#   delay_n = backoff_initial_seconds * (backoff_factor ** (n - 1))
retry:
  max_attempts: 4
  backoff_initial_seconds: 1.0
  backoff_factor: 2.0
  retry_on_status: [429, 500, 502, 503, 504]
  timeout_seconds: 30

# Politeness toward the upstream API: minimum spacing between requests.
rate_limit:
  min_interval_seconds: 0.2

logging:
  level: INFO

# Cleaning / missing-value policy (Prompt 6). Read by pipelines/clean.py.
cleaning:
  # Interior gaps up to this many consecutive days are linearly interpolated and
  # flagged (<var>_imputed). LONGER gaps are left as NaN — never imputed. This is
  # the guard against imputing across the multi-year AQI pre-coverage absence.
  max_interpolation_gap_days: 3

  # How each HOURLY variable is reduced to a daily value. Variables that the API
  # already serves daily (temperature, precipitation) are passed through as-is.
  daily_aggregation:
    humidity: mean
    pm2_5: mean
    pm10: mean
    us_aqi: mean

  # Physically plausible [min, max]. Values outside are dropped to NaN and counted
  # as out-of-range anomalies in data_quality.md (e.g. negative AQI, humidity >100).
  physical_ranges:
    temperature: [-90, 60]      # °C
    humidity: [0, 100]          # %
    precipitation: [0, 1000]    # mm/day
    pm2_5: [0, 1000]            # µg/m³
    pm10: [0, 2000]             # µg/m³
    us_aqi: [0, 1000]           # US AQI

# Feature engineering (Prompt 8). Read by pipelines/features.py. All features are
# CAUSAL (use only weeks <= t, and for climatology only prior years) so there is
# no lookahead into t+1. See reports/feature_dictionary.md for rationale.
features:
  # Lagged predictors: disease responds to environmental drivers weeks earlier
  # (e.g. dengue to rainfall 2-4 weeks prior). lag_k(var)[t] = var[t-k].
  lags:
    variables: [precipitation, temperature, humidity]
    weeks: [1, 2, 3, 4]

  # Trailing means over the N weeks STRICTLY BEFORE t (t-1 .. t-N) — smoothed
  # recent conditions, never including the current week (shift: 1).
  rolling:
    variables: [precipitation, temperature, humidity]
    windows: [3, 4]
    shift: 1

  # Seasonal anomaly = value - that (city, week_of_year) climatology. Climatology
  # is built from PRIOR YEARS ONLY (expanding), so it never uses future data;
  # the first year per city has no climatology (flagged has_climatology=False).
  anomaly:
    variables: [temperature, humidity, precipitation, us_aqi]
    mode: expanding          # expanding | global  (expanding = leakage-free)

  # Cyclical encoding of week-of-year so week 1 and week 52 are adjacent.
  cyclical:
    period: 52

  # Categorical city encoding, fixed vocabulary from cities.yaml (serving builds
  # the same columns for a requested city).
  city_encoding: onehot

  # Rows with fewer than this many preceding weeks cannot have full lag/rolling
  # history. They are flagged (insufficient_lag_history); set drop=true to remove.
  min_history_weeks: 5
  drop_insufficient_history: false

# Environmental risk labels (Prompt 9). Read by pipelines/labels.py.
# Each disease's risk index is a weighted sum of literature-grounded membership
# sub-scores (each in [0,1]); the composite score in [0,1] is mapped to
# Low/Medium/High with a soft transition band (scores within ±band of a boundary
# get probabilistic labels). Every number here is justified/cited in
# reports/label_methodology.md. Determinant params cite literature; the index
# weights and Low/Med/High cutoffs are documented DESIGN choices.
# IMPORTANT: these encode ENVIRONMENTAL disease-risk SUITABILITY, not incidence.
labels:
  seed: 1729                 # fixed seed -> deterministic boundary sampling
  transition_band: 0.06      # ±δ around each Low/Med and Med/High boundary

  diseases:
    # Dengue: Aedes aegypti thermal optimum ~29°C, transmission ~18-34°C
    # (Mordecai et al. 2017, PLoS NTD); humidity aids vector survival and
    # lagged rainfall (2-4 wk) creates breeding sites (Naish et al. 2014, BMC
    # Infect Dis; Reiter 2001, Environ Health Perspect).
    dengue:
      thresholds: {low_medium: 0.33, medium_high: 0.55}
      weights: {temperature: 0.40, humidity: 0.25, rainfall_lag: 0.35}
      temperature_band: {t_min: 18.0, t_opt_lo: 26.0, t_opt_hi: 30.0, t_max: 34.0}
      humidity_ramp: {lo: 40.0, hi: 75.0}
      rainfall_lag: {weeks: [2, 3, 4], cap_mm: 35.0}

    # Smog / respiratory: high PM2.5 (WHO AQG 2021 24-h guideline 15 µg/m³; US
    # EPA AQI breakpoints), the documented Oct-Jan Punjab smog season (Prompt 5
    # reference), low temperature / inversions, and low rainfall (less washout).
    smog:
      thresholds: {low_medium: 0.35, medium_high: 0.58}
      weights: {pm25: 0.45, season: 0.20, low_temperature: 0.20, low_rainfall: 0.15}
      pm25_ramp: {lo: 15.0, hi: 150.0}
      season_months: [10, 11, 12, 1]
      low_temperature_ramp: {hi: 22.0, lo: 8.0}
      low_rainfall_ramp: {wet: 15.0, dry: 0.0}

    # Influenza: transmission favoured by low temperature and low relative
    # humidity in winter (Lowen et al. 2007, PLoS Pathogens — peak at ~5°C and
    # 20-35% RH; Shaman & Kohn 2009, PNAS — absolute humidity & seasonality).
    influenza:
      # Calibrated to the index's right-skewed distribution (influenza risk is
      # only high in cold/dry winter weeks) for a non-degenerate spread.
      thresholds: {low_medium: 0.20, medium_high: 0.45}
      weights: {low_temperature: 0.40, low_humidity: 0.30, season: 0.30}
      low_temperature_ramp: {hi: 18.0, lo: 2.0}
      low_humidity_band: {h_min: 10.0, h_opt_lo: 20.0, h_opt_hi: 35.0, h_max: 60.0}
      season_months: [12, 1, 2]

# Temporal train/test split & validation gate (Prompt 10). Read by pipelines/validate.py.
split:
  # The most-recent N ISO weeks become the TEST block; all earlier weeks are
  # TRAIN. Purely temporal (no shuffling — lagged features make random splits
  # leak). 52 weeks = one full seasonal cycle, so every class appears in test.
  test_weeks: 52
  # Rows without full lag/rolling history (insufficient_lag_history) are excluded
  # from the frozen datasets and documented in the report.
  exclude_insufficient_lag_history: true
  diseases: [dengue, smog, influenza]
